<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f3ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>__TITLE__</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f3ec;--card:#fff;--tx:#16181d;--dim:#374151;--line:#d9d4c7;--ok:#15803d;--ctl:#e6e1d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:22px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Noto Sans Gujarati","Segoe UI",Roboto,sans-serif;line-height:1.35;padding-bottom:40px}
h1{font-size:1.25rem;margin:0;line-height:1.2}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px 4px;max-width:960px;margin:0 auto}
.wrap{padding:8px 14px;max-width:960px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:72px;margin:10px 0;padding:14px 18px;border:2px solid #b9b3a2;border-radius:18px;background:var(--ctl);color:var(--tx);font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.btn:active{filter:brightness(.88);transform:scale(.99)}
.btn.main{background:#15803d;border-color:#15803d;color:#fff;font-size:1.1rem}
.btn.alt{background:#b45309;border-color:#b45309;color:#fff}
.btn.sm{min-height:56px;width:auto;flex:1;margin:6px 4px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:6px}
.tile{display:block;width:100%;border:0;border-radius:22px;color:#fff;margin:14px 0;padding:22px 20px;text-align:left;font:inherit;cursor:pointer;min-height:130px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tile:active{filter:brightness(.88)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tgrid .tile{margin:0;min-height:150px;padding:16px 14px}.tgrid .tile .nm{font-size:1.05rem}.tgrid .tile .en{font-size:.62rem}
.tile.big{min-height:30vh;display:flex;flex-direction:column;justify-content:center}
.tile .ic{font-size:2.4rem;line-height:1}
.tile .nm{font-size:1.35rem;font-weight:800;margin-top:6px}
.tile .en{font-size:.8rem;opacity:.95}
.cont{background:#15803d;display:flex;gap:14px;align-items:center;min-height:0;padding:14px}
.cont img{width:42%;border-radius:12px;flex:none;background:#000;aspect-ratio:16/9;object-fit:cover}
.cont .k{font-size:1.2rem;font-weight:800}
.cont .t{font-size:.8rem;opacity:.95;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:14px 0;overflow:hidden;color:inherit;text-decoration:none;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card:active{filter:brightness(.9)}
.th{position:relative}
.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#cfcabb}
.pg{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(0,0,0,.35)}
.pg i{display:block;height:100%;background:#dc2626}
.card .b{padding:12px 14px 14px}
.card .t{font-size:1rem;font-weight:700}
.card .m{font-size:.8rem;color:var(--dim);margin-top:4px}
.card.done{opacity:.72}
.badge{position:absolute;top:10px;right:10px;background:var(--ok);color:#fff;font-weight:800;font-size:.8rem;padding:6px 12px;border-radius:999px}
.badge.yt{background:#16181d;color:#fff}
.epb{position:absolute;top:8px;left:8px;background:#ffd400;color:#111;font-weight:800;font-size:.7rem;padding:3px 9px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid .card{margin:0}
.grid .card .b{padding:8px 10px 10px}
.grid .card .t{font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.grid .card .m{font-size:.68rem}
.grid .badge{font-size:.62rem;padding:3px 8px;top:6px;right:6px}
.fbtn{min-height:52px;margin:6px 0;font-size:.85rem}
.ctrl{margin:8px 0 4px}
.pills{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;margin:6px -16px 6px;padding:2px 16px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none}
.pill{min-height:52px;white-space:nowrap;padding:6px 14px;border-radius:999px;border:2px solid #8a8577;background:#fff;color:var(--tx);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.pill.on{background:#16181d;color:#fff;border-color:#16181d}
.srow{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;min-height:48px;border-radius:14px;border:2px solid #8a8577;background:#fff;color:var(--tx);font:inherit;font-size:.9rem;padding:8px 14px;margin:4px 0}
.mic{flex:none;width:56px;min-height:48px;border-radius:14px;border:2px solid #8a8577;background:#fff;font-size:1.2rem;cursor:pointer}
.mic.on{background:#dc2626;border-color:#dc2626}
.count{color:var(--dim);font-size:.75rem;margin:4px 2px}
.note{background:#fff3c4;border-radius:14px;padding:12px 14px;font-size:.8rem;color:#5b4a00;margin:8px 0}
#pv{position:relative;width:min(100%,960px,calc(72vh*16/9));aspect-ratio:16/9;background:#000;margin:0 auto}
#pv iframe{position:absolute;inset:0;width:100%;height:100%}
.ptitle{font-size:1rem;font-weight:700;margin:12px auto 4px;padding:0 14px;max-width:960px}
.err{background:#fde2e0;color:#7a1b13;border-radius:14px;padding:14px;margin:10px 0;font-weight:700}
.size{display:flex;align-items:center;gap:8px;margin-top:26px;color:var(--dim);font-size:.8rem}
.size .btn{min-height:56px;width:90px;margin:0;font-size:1.1rem}
.tip{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 16px;font-size:.8rem}
.tip summary{min-height:52px;display:flex;align-items:center;font-weight:700;font-size:.9rem;cursor:pointer}
.tip p{margin:4px 0 10px;color:var(--dim)}
.fv{position:absolute;right:8px;bottom:14px;color:#fff;background:rgba(190,18,60,.92);border-radius:999px;padding:0 9px;font-size:.8rem;line-height:1.5}
.toast{position:fixed;left:14px;right:14px;bottom:20px;background:#16181d;color:#fff;border-radius:16px;padding:16px;font-weight:700;text-align:center;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.empty{color:var(--dim);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D=/*DATA*/null;
const KEY='tv:'+D.profile;
const T0={back:'← Back',cont:'▶ Continue watching',nextc:'▶ Start',rand:'🎲 Surprise me',more:'Show more ▼',
 done:'✔ Watched',yt:'Opens in YouTube ↗',prev:'⏮ Previous',next:'⏭ Next',list:'☰ List',
 fail:"This video can't play here.",open:'Open in YouTube ↗',size:'Text size',none:'Nothing found',
 oldnote:'These open in YouTube.',parts:'videos',mi:'min',s_new:'Newest',s_old:'Oldest',s_pop:'Most viewed',s_num:'Episode no.',unw:'Unwatched',search:'🔍 Search…',
 filt:'⚙ Sort & search ▾',filt2:'⚙ Sort & search ▴',back10:'⏪ 10s',fwd30:'30s ⏩',pause:'⏸ Pause',play:'▶ Play',
 shuf:'🔀 Play all, shuffled',fav0:'♡ Save to favourites',fav1:'♥ Saved to favourites',favs:'♥ Favourites',favsub:'Videos you saved',sleep:'😴 Sleep timer: ',off:'off',sleepdone:'Sleep timer finished. Good night!',
 tv:'📺 Watch on TV',tv1:'Smart TV: open this website in the TV’s own web browser.',tv2:'Phone with Chrome: tap the ⋮ menu, then Cast…, and pick your TV.',tv3:'Or plug the phone into the TV with an HDMI cable (Android) or Lightning/USB-C adapter (iPhone).'};
const T=Object.assign({},T0,D.T||{});
let S;
try{S=Object.assign({w:{},p:{},last:null,z:2,fav:{}},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S={w:{},p:{},last:null,z:2,fav:{}}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const SIZES=[20,24,28,32];
const applySize=()=>{document.documentElement.style.fontSize=SIZES[Math.max(0,Math.min(3,S.z))]+'px'};
applySize();

const $app=document.getElementById('app');
const PARENT={};D.tiles.forEach(g=>{if(g.children)g.children.forEach(k=>PARENT[k]=g)});
const SH={};D.shows.forEach(s=>{SH[s.key]=s;s.items.forEach(i=>{i.id=i[0]})});
function el(tag,cls,txt,attrs){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
const thumb=id=>'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
const ytUrl=(it)=>'https://www.youtube.com/watch?v='+it[0]+(it[6]?'&list='+D.cidPlaylist:'');
const go=h=>{location.hash=h};
const find=(key,id)=>SH[key]&&SH[key].items.find(i=>i[0]===id);
function label(it){return it[1]}
function cardTitle(it){return it[4]?(it[1].replace(/^Ep \d+( — )?/,'')||it[1]):it[1]}
function meta(it){const d=it[2].split('-');return [it[3]?it[3]+' '+T.mi:'',d[2]+'-'+d[1]+'-'+d[0].slice(2)].filter(Boolean).join(' · ')}
function frac(it){if(S.w[it[0]])return 1;const p=S.p[it[0]];return p&&it[3]?Math.min(.97,p/(it[3]*60)):0}

function favItems(){const seen={},a=[];D.shows.forEach(s=>s.items.forEach(i=>{if(S.fav[i[0]]&&!seen[i[0]]){seen[i[0]]=1;a.push(i)}}));return a}
function refreshFav(){SH.fav={key:'fav',name:T.favs,sub:T.favsub,icon:'♥',color:'#be123c',sort:'new',items:favItems()}}
function toast(msg){const d=el('div','toast',msg);document.body.append(d);setTimeout(()=>d.remove(),15000);d.onclick=()=>d.remove()}
let sleepAt=0,sleepIdx=0;const SLEEPS=[0,15,30,60];
setInterval(()=>{if(sleepAt&&Date.now()>=sleepAt){sleepAt=0;sleepIdx=0;try{if(P&&P.pauseVideo)P.pauseVideo()}catch(e){}toast(T.sleepdone)}},10000);
function markWatched(id){S.w[id]=1;delete S.p[id];save()}
function openExternal(key,it){S.w[it[0]]=1;S.last={show:key,id:it[0]};save();window.open(ytUrl(it),'_blank')}
function play(key,it){
  if(it[5]){openExternal(key,it);render();return}
  go('#/p/'+key+'/'+it[0]);
}

/* ---------- screens ---------- */
function home(){
  $app.replaceChildren();
  const top=el('div','top');top.append(el('h1',null,D.title));$app.append(top);
  const w=el('div','wrap');
  const last=S.last&&find(S.last.show,S.last.id);
  if(last){
    const b=el('button','tile cont');
    const img=el('img');img.src=thumb(last[0]);img.alt='';
    const d=el('div');d.append(el('div','k',T.cont),el('div','t',label(last)));
    b.append(img,d);b.onclick=()=>play(S.last.show,last);w.append(b);
  }
  const many=D.tiles.length>4;
  const tg=el('div',many?'tgrid':null);w.append(tg);
  D.tiles.forEach(x=>{
    const g=x.children?x:null,s=g||SH[x.show];
    const n=g?g.children.reduce((a,k)=>a+SH[k].items.length,0):s.items.length;
    const b=el('button','tile'+(D.tiles.length<=3?' big':''));b.style.background=s.color;
    b.append(el('div','ic',s.icon),el('div','nm',s.name),el('div','en',s.sub+' · '+n+' '+T.parts));
    b.onclick=()=>go(g?'#/g/'+g.group:'#/s/'+s.key);tg.append(b);
  });
  if(D.profile==='mummy'){
    const s=SH.fav;const b=el('button','tile');b.style.background=s.color;b.style.marginTop='10px';
    b.append(el('div','ic',s.icon),el('div','nm',s.name),el('div','en',s.sub+' · '+s.items.length+' '+T.parts));
    b.onclick=()=>go('#/s/fav');w.append(b);
  }
  const z=el('div','size');z.append(el('span',null,T.size));
  const m=el('button','btn','A−');m.onclick=()=>{S.z=Math.max(0,S.z-1);save();applySize()};
  const p=el('button','btn','A+');p.onclick=()=>{S.z=Math.min(3,S.z+1);save();applySize()};
  z.append(m,p);w.append(z);
  const tip=el('details','tip');tip.append(el('summary',null,T.tv),el('p',null,T.tv1),el('p',null,T.tv2),el('p',null,T.tv3));
  w.append(tip);
  if(D.built)w.append(el('div','count','Updated '+D.built+' · '+D.shows.reduce((a,s)=>a+s.items.length,0)+' videos'));
  $app.append(w);
  window.scrollTo(0,0);
}

const SORTS=[['new',T.s_new],['old',T.s_old],['pop',T.s_pop],['num',T.s_num]];
const VIEW={};
function groupPage(key){
  const g=D.tiles.find(x=>x.group===key);if(!g){go('#/');return}
  $app.replaceChildren();
  const top=el('div','top');
  const back=el('button','btn sm',T.back);back.style.flex='none';back.style.width='auto';back.style.margin='0';back.onclick=()=>go('#/');
  top.append(back,el('h1',null,g.name));$app.append(top);
  const w=el('div','wrap');
  g.children.forEach(k=>{
    const s=SH[k];const b=el('button','tile big');b.style.background=s.color;
    b.append(el('div','ic',s.icon),el('div','nm',s.name),el('div','en',s.sub+' · '+s.items.length+' '+T.parts));
    b.onclick=()=>go('#/s/'+k);w.append(b);
  });
  $app.append(w);window.scrollTo(0,0);
}
let shown=20;
const MEM={};let prevHash='',curKey=null;
window.addEventListener('scroll',()=>{if(curKey){(MEM[curKey]=MEM[curKey]||{}).y=window.scrollY}},{passive:true});
function sorted(s,o){
  let a=s.items.slice();
  if(o.u)a=a.filter(i=>!S.w[i[0]]);
  if(o.q){const q=o.q.toLowerCase();a=a.filter(i=>i[1].toLowerCase().includes(q)||String(i[4])===q)}
  if(o.s==='new')a.sort((x,y)=>x[2]<y[2]?1:x[2]>y[2]?-1:y[4]-x[4]);
  else if(o.s==='old')a.sort((x,y)=>x[2]<y[2]?-1:x[2]>y[2]?1:x[4]-y[4]);
  else if(o.s==='pop')a.sort((x,y)=>(y[7]||0)-(x[7]||0));
  else a.sort((x,y)=>((x[4]||1e9)-(y[4]||1e9))||(x[2]<y[2]?-1:1));
  return a;
}
function showPage(key){
  const s=SH[key];if(!s){go('#/');return}
  $app.replaceChildren();
  const back_=prevHash.indexOf('#/p/'+key+'/')===0&&MEM[key];
  shown=back_?(MEM[key].shown||20):20;
  S.o=S.o||{};
  const hasNum=s.items.filter(i=>i[4]).length>s.items.length*0.2;
  const o=S.o[key]||(S.o[key]={s:s.sort||(hasNum&&(key==='cidold'||key==='cidclassic')?'num':'new'),u:0});
  if(!['new','old','pop'].includes(o.s)||(o.s==='pop'&&D.profile!=='mummy'&&key!=='fav'))o.s='new';
  o.q='';
  const top=el('div','top');
  const back=el('button','btn sm',T.back);back.style.flex='none';back.style.width='auto';back.style.margin='0';back.onclick=()=>go(PARENT[key]?'#/g/'+PARENT[key].group:'#/');
  top.append(back,el('h1',null,s.name));$app.append(top);
  const w=el('div','wrap');
  if(!s.items.length){w.append(el('div','empty',T.none));$app.append(w);return}
  const nextUp=()=>{const l=[...s.items].sort((x,y)=>x[2]<y[2]?-1:x[2]>y[2]?1:x[4]-y[4]);return l.find(i=>!S.w[i[0]]&&!i[5])||l.find(i=>!i[5])||l[0]};
  const nu=nextUp();
  const bn=el('button','btn main',(S.w[s.items[0][0]]||Object.keys(S.w).some(k=>s.items.some(i=>i[0]===k))?'▶ Continue':'▶ Start')+(nu&&nu[4]?' · Ep '+nu[4]:''));
  bn.onclick=()=>{VIEW[key]=[...s.items].filter(i=>!i[5]||s.items.every(j=>j[5])).sort((x,y)=>x[2]<y[2]?-1:x[2]>y[2]?1:x[4]-y[4]);play(key,nu)};
  w.append(bn);
  if(D.profile==='mummy'||key==='fav'){
    const sh=el('button','btn',T.shuf);
    sh.onclick=()=>{const l=sorted(s,o).filter(i=>!i[5]);if(!l.length)return;
      for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}
      VIEW[key]=l;go('#/p/'+key+'/'+l[0][0])};
    w.append(sh);
  }
  if(s.items.every(i=>i[5]))w.append(el('div','note',T.oldnote));

  /* sort & search live behind one button so the list stays clean */
  const panel=el('div','ctrl');w.append(panel);
  const pills=el('div','pills');
  SORTS.filter(x=>x[0]==='new'||x[0]==='old'||(x[0]==='pop'&&(D.profile==='mummy'||key==='fav'))).forEach(([k,n])=>{
    const b=el('button','pill'+(o.s===k?' on':''),n);b.dataset.k=k;
    b.onclick=()=>{o.s=k;save();shown=20;[...pills.querySelectorAll('[data-k]')].forEach(c=>c.classList.toggle('on',c.dataset.k===o.s));draw()};
    pills.append(b);
  });
  o.u=0;panel.append(pills);
  const srow=el('div','srow');
  const q=el('input','search',null,{type:'search',placeholder:T.search,autocomplete:'off'});
  q.oninput=()=>{o.q=q.value.trim();shown=20;draw()};srow.append(q);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    const mic=el('button','mic','🎤',{type:'button','aria-label':'Speak to search'});
    mic.onclick=()=>{
      try{
        const r=new SR();r.lang=s.voice||'en-IN';r.interimResults=false;r.maxAlternatives=1;
        mic.classList.add('on');
        r.onresult=e=>{q.value=e.results[0][0].transcript;o.q=q.value.trim();shown=20;draw()};
        r.onend=r.onerror=()=>mic.classList.remove('on');
        r.start();
      }catch(e){mic.classList.remove('on')}
    };
    srow.append(mic);
  }
  panel.append(srow);
  const cnt=el('div','count');w.append(cnt);
  const grid=el('div','grid');w.append(grid);
  const more=el('button','btn',T.more);
  function draw(){
    const list=sorted(s,o);VIEW[key]=list;
    cnt.textContent=list.length+' '+T.parts;
    grid.replaceChildren();
    list.slice(0,shown).forEach(it=>{
      const done=!!S.w[it[0]];
      let c;
      if(it[5]){c=el('a','card'+(done?' done':''),null,{href:ytUrl(it),target:'_blank',rel:'noopener'});
        c.onclick=()=>{S.w[it[0]]=1;S.last={show:key,id:it[0]};save();setTimeout(draw,300)};}
      else{c=el('a','card'+(done?' done':''),null,{href:'#/p/'+key+'/'+it[0]})}
      const th=el('div','th');
      const img=el('img');img.loading='lazy';img.src=thumb(it[0]);img.alt='';th.append(img);
      const f=frac(it);
      if(f>0&&!it[5]){const pg=el('div','pg');const bar=el('i');bar.style.width=Math.round(f*100)+'%';pg.append(bar);th.append(pg)}
      const b=el('div','b');b.append(el('div','t',cardTitle(it)),el('div','m',meta(it)));
      c.append(th,b);
      if(it[4])c.append(el('div','epb','Ep '+it[4]));
      if(S.fav[it[0]])c.append(el('div','fv','♥'));
      if(done)c.append(el('div','badge',T.done));
      grid.append(c);
    });
    more.style.display=shown<list.length?'flex':'none';
    if(MEM[key])MEM[key].shown=shown;
  }
  more.onclick=()=>{shown+=20;draw()};
  draw();w.append(more);$app.append(w);
  curKey=key;(MEM[key]=MEM[key]||{}).shown=shown;
  window.scrollTo(0,back_?(MEM[key].y||0):0);
}

/* ---------- player ---------- */
let P=null,tick=null,apiReady=false,pending=null,WL=null,playing=false;
window.onYouTubeIframeAPIReady=()=>{apiReady=true;if(pending){pending();pending=null}};
function loadApi(){if(document.getElementById('ytapi'))return;const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';document.head.append(s)}
async function wake(on){
  try{
    if(on){if(!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}
    else if(WL){const w=WL;WL=null;await w.release()}
  }catch(e){}
}
function stopPlayer(){playing=false;wake(false);clearInterval(tick);tick=null;if(P){try{savePos()}catch(e){}try{P.destroy()}catch(e){}P=null}}
function savePos(){
  if(!P||!P.getCurrentTime)return;const id=P.__id;const t=Math.floor(P.getCurrentTime()||0),d=Math.floor(P.getDuration()||0);
  if(!d)return;
  if(t>d*0.92){markWatched(id)}else if(t>10){S.p[id]=t;S.last={show:P.__key,id:id};save()}
}
function neighbor(key,id,dir){
  const items=VIEW[key]||SH[key].items;let i=items.findIndex(x=>x[0]===id);
  for(i+=dir;i>=0&&i<items.length;i+=dir){if(!items[i][5])return items[i]}
  return null;
}
function playerPage(key,id){
  const it=find(key,id);if(!it){go('#/');return}
  $app.replaceChildren();
  const pv=el('div');pv.id='pv';pv.append(el('div',null,null,{id:'yt'}));$app.append(pv);
  $app.append(el('div','ptitle',it[4]&&!/^Ep \d+$/.test(it[1])?'Ep '+it[4]+' — '+cardTitle(it):it[1]));
  const w=el('div','wrap');
  const err=el('div','err',T.fail);err.style.display='none';
  const eb=el('a','btn alt',T.open,{href:ytUrl(it),target:'_blank',rel:'noopener'});eb.style.display='none';eb.onclick=()=>markWatched(id);
  w.append(err,eb);
  /* big remote-control buttons */
  const rc=el('div','row');
  const bb=el('button','btn sm',T.back10);
  const bpp=el('button','btn sm main',T.pause);
  const bf=el('button','btn sm',T.fwd30);
  bb.onclick=()=>{try{P.seekTo(Math.max(0,P.getCurrentTime()-10),true)}catch(e){}};
  bf.onclick=()=>{try{P.seekTo(P.getCurrentTime()+30,true)}catch(e){}};
  bpp.onclick=()=>{try{(P.getPlayerState()===1)?P.pauseVideo():P.playVideo()}catch(e){}};
  bpp.style.flex='1.6';rc.append(bb,bpp,bf);w.append(rc);
  const prev=neighbor(key,id,-1),next=neighbor(key,id,1);
  const row=el('div','row');
  const bp=el('button','btn sm',T.prev);bp.disabled=!prev;bp.onclick=()=>prev&&go('#/p/'+key+'/'+prev[0]);
  const bn=el('button','btn sm main',T.next);bn.disabled=!next;bn.onclick=()=>next&&go('#/p/'+key+'/'+next[0]);
  row.append(bp,bn);w.append(row);
  const more=el('details','tip');more.append(el('summary',null,'⋯ More'));
  const fb=el('button','btn',S.fav[id]?T.fav1:T.fav0);
  fb.onclick=()=>{if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();fb.textContent=S.fav[id]?T.fav1:T.fav0;refreshFav()};
  if(D.profile==='mummy')more.append(fb);
  const sb=el('button','btn');
  const slab=()=>T.sleep+(sleepAt>Date.now()?SLEEPS[sleepIdx]+' min':T.off);
  sb.textContent=slab();
  sb.onclick=()=>{sleepIdx=(sleepIdx+1)%SLEEPS.length;sleepAt=SLEEPS[sleepIdx]?Date.now()+SLEEPS[sleepIdx]*60000:0;sb.textContent=slab()};
  more.append(sb);
  const bl=el('button','btn',T.list);bl.onclick=()=>go('#/s/'+key);w.append(bl);w.append(more);
  $app.append(w);window.scrollTo(0,0);
  S.last={show:key,id:id};save();
  const start=()=>{
    const st=S.p[id]||0;
    P=new YT.Player('yt',{width:'100%',height:'100%',videoId:id,
      playerVars:{rel:0,playsinline:1,autoplay:1,start:st>10?st:0,modestbranding:1},
      events:{
        onReady:e=>{e.target.__id=id;e.target.__key=key},
        onStateChange:e=>{
          if(e.data===1){playing=true;bpp.textContent=T.pause;wake(true);clearInterval(tick);tick=setInterval(savePos,5000)}
          else if(e.data===2){playing=false;bpp.textContent=T.play;savePos()}
          else if(e.data===0){markWatched(id);clearInterval(tick);if(next)go('#/p/'+key+'/'+next[0]);else go('#/s/'+key)}
        },
        onError:()=>{err.style.display='block';eb.style.display='flex'}
      }});
    P.__id=id;P.__key=key;
  };
  if(apiReady)start();else{pending=start;loadApi()}
}

function render(){
  stopPlayer();refreshFav();
  const nowHash=location.hash;if(nowHash.indexOf('#/s/')!==0)curKey=null;
  const h=location.hash.split('/');
  if(h[1]==='g')groupPage(h[2]);
  else if(h[1]==='s')showPage(decodeURIComponent(h[2]||''));
  else if(h[1]==='p')playerPage(h[2],h[3]);
  else home();
  prevHash=nowHash;
}
window.addEventListener('hashchange',render);
window.addEventListener('pagehide',()=>{try{savePos()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{savePos()}catch(e){}}else if(playing)wake(true)});
render();
</script>
</body>
</html>
