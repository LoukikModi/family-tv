<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMKOC Tube</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#eef0f4;--mut:#9aa3b2;--ac:#ffb020;--ac2:#ff6b3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;margin:0 8px 0 0}h1 b{color:var(--ac)}
.tabs button,.mode button,select,input[type=search],.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.tabs button.on,.mode button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
input[type=search]{min-width:200px;flex:1;max-width:320px;cursor:text}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(min-width:1000px){main.playing{grid-template-columns:minmax(0,1fr) 400px}}
#player{display:none}main.playing #player{display:block}
.pw{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.pw iframe,.pw #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
#ptitle{font-size:17px;margin:10px 0 4px}.meta{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h3{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sl{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.sl input{accent-color:var(--ac)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;color:var(--mut);font-size:13px}
.filters label{display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{cursor:pointer;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid transparent;position:relative}
.card:hover{border-color:var(--ac)}.card.cur{border-color:var(--ac2)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.card .d{position:absolute;right:6px;top:calc(56.25% * 1 - 26px);top:auto;background:rgba(0,0,0,.8);font-size:12px;padding:1px 6px;border-radius:4px}
.thumb{position:relative}.thumb .d{position:absolute;right:6px;bottom:6px}
.thumb .w{position:absolute;left:0;bottom:0;height:3px;background:var(--ac2)}
.card .t{padding:8px 10px 10px}.card .t div:first-child{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.seen{opacity:.55}
.ep{display:inline-block;background:var(--ac);color:#111;border-radius:4px;font-size:11px;font-weight:700;padding:0 5px;margin-right:6px}
#more{display:block;margin:20px auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#12151b;border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}.pl{color:var(--mut);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.count{color:var(--mut);margin:0 0 10px;font-size:13px}
</style></head><body>
<header>
<h1>TMKOC <b>Tube</b></h1>
<div class="tabs"><button data-k="episode" class="on">Episodes</button><button data-k="movie">Full Movies</button></div>
<input id="q" type="search" placeholder="Search title, character, year…">
<div class="mode" id="modes"></div>
</header>
<main id="main">
<section id="player">
 <div class="pw"><div id="yt"></div></div>
 <h2 id="ptitle"></h2><div class="meta" id="pmeta"></div><p class="meta" id="pplot" style="margin:6px 0 0"></p><div class="meta" id="palt" style="margin-top:6px"></div>
 <div class="row"><button class="btn" id="prev">⏮ Previous</button><button class="btn" id="next">Next ⏭</button><button class="btn" id="auto">Autoplay next: on</button><button class="btn" id="close">Close player</button></div>
</section>
<section>
 <div class="panel" id="algo" style="margin-bottom:12px"><h3>Your algorithm</h3>
  <div id="sliders"></div><div class="meta">Score = weighted mix. Set a slider to 0 to ignore it. “Shuffle” re-rolls the random part.</div>
  <div class="row"><button class="btn" id="shuffle">🎲 Shuffle</button><button class="btn" id="reset">Reset watched</button></div></div>
 <div class="panel" style="margin-bottom:12px"><h3>Characters</h3><div class="chips" id="cchips"></div><h3 style="margin-top:10px">Themes</h3><div class="chips" id="tchips"></div></div>
 <div class="filters">
  <label>Year <select id="year"><option value="">All</option></select></label>
  <label>Length <select id="len"><option value="">Any</option></select></label>
  <label><input type="checkbox" id="unseen"> Unwatched only</label>
 </div>
 <div class="count" id="count"></div>
 <div class="grid" id="grid"></div>
 <button class="btn" id="more">Load more</button>
</section>
</main>
<script>
const BUNDLE=/*DATA*/{data:[],chars:[],themes:[]};const DATA=BUNDLE.data;
const S={kind:'episode',mode:'order',q:'',cs:new Set(),ts:new Set(),year:'',len:'',unseen:false,list:[],shown:0,cur:null,auto:true,seed:Math.random(),w:{views:30,quality:50,recent:10,length:0,random:0}};
let store={watched:{},pos:{}};
try{const x=localStorage.getItem('tmkoc');if(x)store=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem('tmkoc',JSON.stringify(store))}catch(e){}};
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m+' min'};
const MODES={order:'Watch in order',resume:'Continue',new:'Newest',pop:'Most viewed',best:'Best of',rand:'Random classics',mix:'My mix'};
const modes=document.getElementById('modes');
for(const k in MODES){const b=document.createElement('button');b.textContent=MODES[k];b.dataset.k=k;b.onclick=()=>{S.mode=k;if(k==='rand')S.seed=Math.random();render()};modes.append(b)}
const SL={views:'Popularity',quality:'Quality (likes)',recent:'Recent',length:'Longer',random:'Random'};
const sl=document.getElementById('sliders');
for(const k in SL){sl.insertAdjacentHTML('beforeend',`<div class="sl"><span>${SL[k]}</span><input type="range" min="0" max="100" value="${S.w[k]}" data-k="${k}"><span id="v_${k}">${S.w[k]}</span></div>`)}
sl.oninput=e=>{const k=e.target.dataset.k;S.w[k]=+e.target.value;document.getElementById('v_'+k).textContent=e.target.value;S.mode='mix';render()};
function chips(el,names,set){const e=document.getElementById(el);e.innerHTML=names.map((n,i)=>`<span class="chip" data-i="${i}">${n}</span>`).join('');e.onclick=ev=>{const c=ev.target.closest('.chip');if(!c)return;const i=+c.dataset.i;set.has(i)?set.delete(i):set.add(i);c.classList.toggle('on');render()}}
chips('cchips',BUNDLE.chars,S.cs);chips('tchips',BUNDLE.themes,S.ts);
const years=[...new Set(DATA.map(d=>d.p.slice(0,4)))].sort().reverse();
document.getElementById('year').innerHTML+=years.map(y=>`<option>${y}</option>`).join('');
const LENS={'u20':'Under 20 min','20-30':'20–30 min','30-45':'30–45 min','45+':'45+ min'};
document.getElementById('len').innerHTML+=Object.entries(LENS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
const inLen=(s,l)=>!l||(l==='u20'?s<1200:l==='20-30'?s>=1200&&s<1800:l==='30-45'?s>=1800&&s<2700:s>=2700);
function rnd(id){let h=2166136261^Math.floor(S.seed*1e9);for(let i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
function build(){
 const q=S.q.toLowerCase().trim();
 let a=DATA.filter(d=>d.k===S.kind&&(!S.year||d.p.startsWith(S.year))&&inLen(d.s,S.len)&&(!q||d.t.toLowerCase().includes(q)||d.d.toLowerCase().includes(q)||d.p.includes(q)||(d.e&&String(d.e)===q))&&[...S.cs].every(i=>d.c.includes(i))&&[...S.ts].every(i=>d.h.includes(i))&&(!S.unseen||!store.watched[d.id]));
 const by=(f,dir=1)=>a.sort((x,y)=>dir*(f(x)-f(y))||(x.p<y.p?-1:1));
 if(S.mode==='order'||S.mode==='resume'){
  a.sort((x,y)=>(x.e&&y.e&&x.e!==y.e)?x.e-y.e:(x.p===y.p?(x.e||0)-(y.e||0):(x.p<y.p?-1:1)));
  if(S.mode==='resume'){const i=a.findIndex(d=>!store.watched[d.id]);if(i>0)a=a.slice(i)}
 }else if(S.mode==='new')a.sort((x,y)=>S.kind==='episode'?((y.e||0)-(x.e||0)||(x.p<y.p?1:-1)):(x.p<y.p?1:-1));
 else if(S.mode==='pop')by(d=>d.v,-1);
 else if(S.mode==='best'){a=a.filter(d=>d.v>=20000);a.sort((x,y)=>y.z-x.z)}
 else if(S.mode==='rand')a.sort((x,y)=>rnd(x.id)-rnd(y.id));
 else{
  const mx=Math.max(...a.map(d=>Math.log10(d.v+1)),1),t0=Math.min(...a.map(d=>+new Date(d.p)),0),t1=Math.max(...a.map(d=>+new Date(d.p)),1);
  const qm=1;const sc=d=>S.w.views*Math.log10(d.v+1)/mx+S.w.quality*d.z/qm+S.w.recent*(new Date(d.p)-t0)/(t1-t0||1)+S.w.length*Math.min(d.s/3600,1)+S.w.random*rnd(d.id);
  const m=new Map(a.map(d=>[d.id,sc(d)]));a.sort((x,y)=>m.get(y.id)-m.get(x.id));
 }
 S.list=a;
}
function card(d){
 const w=store.pos[d.id]?Math.min(100,store.pos[d.id]/d.s*100):0;
 return `<div class="card${store.watched[d.id]?' seen':''}${S.cur===d.id?' cur':''}" data-id="${d.id}"><div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/${d.id}/mqdefault.jpg" alt=""><span class="d">${fmt(d.s)}</span>${w?`<div class="w" style="width:${w}%"></div>`:''}</div><div class="t"><div>${d.e?`<span class="ep">${d.x?'~':''}${d.e}</span>`:''}${esc(clean(d.t))}</div><div class="meta">${d.p} · ${d.v.toLocaleString()} views · 👍 ${(d.q/10).toFixed(1)}%</div>${d.d?`<div class="pl">${esc(d.d)}</div>`:''}</div></div>`}
const clean=t=>{let s=t.split('|')[0].trim().replace(/\s*[-–]\s*Taarak Mehta Ka Oo?ltah Chash?mah.*$/i,'').replace(/^Taarak Mehta Ka Oo?ltah Chash?mah\s*[-–]\s*/i,'').replace(/\s*[-–]\s*(Full Episode|FE)\s*$/i,'');return s||t};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 build();S.shown=0;document.getElementById('grid').innerHTML='';more();
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.kind));
 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.mode));
 document.getElementById('algo').style.display=S.mode==='mix'?'':'none';
 document.getElementById('count').textContent=S.list.length.toLocaleString()+' videos · '+MODES[S.mode];
}
function more(){
 const g=document.getElementById('grid');g.insertAdjacentHTML('beforeend',S.list.slice(S.shown,S.shown+60).map(card).join(''));S.shown+=60;
 document.getElementById('more').style.display=S.shown<S.list.length?'':'none';
}
document.getElementById('more').onclick=more;
document.getElementById('grid').onclick=e=>{const c=e.target.closest('.card');if(c)play(c.dataset.id)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.kind=b.dataset.k;render()});
document.getElementById('q').oninput=e=>{S.q=e.target.value;render()};
document.getElementById('year').onchange=e=>{S.year=e.target.value;render()};
document.getElementById('len').onchange=e=>{S.len=e.target.value;render()};
document.getElementById('unseen').onchange=e=>{S.unseen=e.target.checked;render()};
document.getElementById('shuffle').onclick=()=>{S.seed=Math.random();render()};
document.getElementById('reset').onclick=()=>{store={watched:{},pos:{}};save();render()};
document.getElementById('auto').onclick=e=>{S.auto=!S.auto;e.target.textContent='Autoplay next: '+(S.auto?'on':'off')};
document.getElementById('close').onclick=()=>{document.getElementById('main').classList.remove('playing');if(P&&P.stopVideo)P.stopVideo();S.cur=null};
const step=n=>{const i=S.list.findIndex(d=>d.id===S.cur);const d=S.list[i+n];if(d)play(d.id)};
document.getElementById('next').onclick=()=>step(1);document.getElementById('prev').onclick=()=>step(-1);
let P=null,ready=false,pending=null,tick=null;
function play(id){
 const d=DATA.find(x=>x.id===id);S.cur=id;
 document.getElementById('main').classList.add('playing');
 document.getElementById('ptitle').textContent=d.t;document.getElementById('pplot').textContent=d.d||'';document.getElementById('palt').innerHTML=d.o?'Other uploads of this episode: '+d.o.map(a=>`<a style="color:#ffb020" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${a[0]}">${a[1]} · ${fmt(a[2])}</a>`).join(' · '):'';document.getElementById('pmeta').innerHTML='<a style="color:#ffb020" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+id+'">Open on YouTube</a> · '+d.p+' · '+fmt(d.s)+' · '+d.v.toLocaleString()+' views'+(d.e?' · Episode '+d.e:'');
 window.scrollTo({top:0,behavior:'smooth'});
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('cur',c.dataset.id===id));
 if(!ready){pending=d;return}
 P.loadVideoById({videoId:id,startSeconds:Math.max(0,(store.pos[id]||0)-3)});
}
function onYouTubeIframeAPIReady(){
 P=new YT.Player('yt',{width:'100%',height:'100%',playerVars:{rel:0,playsinline:1,autoplay:1},events:{
  onReady:()=>{ready=true;if(pending)play(pending.id)},
  onStateChange:e=>{
   if(e.data===1){clearInterval(tick);tick=setInterval(()=>{if(S.cur){store.pos[S.cur]=P.getCurrentTime();const d=DATA.find(x=>x.id===S.cur);if(d&&store.pos[S.cur]>d.s*.85)store.watched[S.cur]=1;save()}},5000)}
   if(e.data===0){store.watched[S.cur]=1;save();if(S.auto)step(1)}
   if(e.data===2)clearInterval(tick);
  },
  onError:e=>{if([100,101,150].includes(e.data)){step(1)}else{document.getElementById('pmeta').insertAdjacentHTML('beforeend',' · <b>Player error '+e.data+'. Open the site from a web address, not a file.</b>')}}}});
}
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s);
render();
</script></body></html>
