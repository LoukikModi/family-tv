name: Probe mummy channels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/probe_mummy.py', '.github/workflows/probe-mummy.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/probe_mummy.py
        env:
          YT_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name family-tv-bot
          git config user.email bot@users.noreply.github.com
          git add data/probe_mummy.json
          git diff --cached --quiet || (git commit -m "Probe mummy result" && git pull --rebase -q && git push)
