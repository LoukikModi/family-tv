name: Update site

on:
  schedule:
    # TMKOC episodes go live at 21:00 IST (15:30 UTC), Monday to Saturday.
    - cron: '25,30,35,40,45,50,55 15 * * 1-6'   # 20:55-21:25 IST, every 5 min
    - cron: '*/5 16 * * 1-6'                    # 21:30-22:25 IST, every 5 min
    - cron: '0 17 * * 1-6'                      # 22:30 IST
    - cron: '10 * * * *'                        # every hour, catches odd uploads
    - cron: '30 2 * * 0'                        # Sunday: full refresh of views/likes
  push:
    branches: [main]
    paths: ['web/**', 'pipeline/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: quick = new uploads only, full = also refresh views/likes
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tmkoc-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.upd.outputs.changed == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: upd
        env:
          YT_KEY: ${{ secrets.YT_API_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 2 * * 0' && 'full') || 'quick' }}
        run: python pipeline/update.py "$MODE"
      - name: Commit updated data
        if: steps.upd.outputs.changed == 'true'
        run: |
          git config user.name "tmkoc-bot"
          git config user.email "tmkoc-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update data"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.upd.outputs.changed == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: steps.upd.outputs.changed == 'true' || github.event_name == 'push'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
