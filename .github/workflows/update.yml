name: Update site

on:
  schedule:
    # GitHub treats schedules as best-effort, so these may run late.
    - cron: '17 */3 * * *'                      # every 3 hours: newest uploads
    - cron: '40 1 * * *'                        # daily: deep scan of channels and playlists
  push:
    branches: [main]
    paths: ['web/**', 'pipeline/**', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: quick = newest uploads only, full = deep scan
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: family-tv-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.upd.outputs.changed == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - id: upd
        env:
          YT_KEY: ${{ secrets.YT_API_KEY }}
          MODE: ${{ github.event.inputs.mode || ((github.event_name == 'push' || github.event.schedule == '40 1 * * *') && 'full') || 'quick' }}
        run: python pipeline/build.py "$MODE"
      - name: Commit updated data
        if: steps.upd.outputs.changed == 'true'
        run: |
          git config user.name "family-tv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update data"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.upd.outputs.changed == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: steps.upd.outputs.changed == 'true' || github.event_name == 'push'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
