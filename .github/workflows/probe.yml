name: Probe shows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/probe_shows.py', '.github/workflows/probe.yml']
permissions:
  contents: write
concurrency:
  group: tmkoc-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official channels
        env:
          YT_KEY: ${{ secrets.YT_API_KEY }}
        run: python pipeline/probe_shows.py
      - name: Commit result
        run: |
          git config user.name tmkoc-bot
          git config user.email bot@users.noreply.github.com
          git add data/probe.json
          git diff --cached --quiet || (git commit -m "Probe result" && git pull --rebase -q && git push)
